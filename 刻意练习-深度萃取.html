<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f4eb" />
<meta name="color-scheme" content="light" />
<title>刻意练习 · 读书卡</title>
<style>
  :root {
    --bg: #f7f4eb;
    --surface: #fdfcf6;
    --fg: #26281f;
    --fg-body: color-mix(in oklch, var(--fg) 84%, var(--bg));
    --muted: #676b5e;
    --border: color-mix(in srgb, var(--fg) 15%, transparent);
    --border-strong: color-mix(in srgb, var(--fg) 36%, transparent);
    --accent: #b23a2d;
    --accent-deep: color-mix(in oklch, var(--accent) 86%, black);
    --stage: #181911;
    --stage-lift: #23241c;
    --font-display: Georgia, "Songti SC", "STSong", "Noto Serif SC", "Noto Serif CJK SC", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --gutter: clamp(22px, 6vw, 30px);
    --ease: cubic-bezier(.32, .72, .22, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100svh;
    height: 100dvh;
    overflow: hidden;
    background: var(--bg);
  }
  .screen.grabbing { user-select: none; -webkit-user-select: none; cursor: grabbing; }

  .progress {
    position: absolute;
    z-index: 30;
    top: max(0px, env(safe-area-inset-top, 0px));
    left: 0; right: 0;
    height: 2px;
    background: color-mix(in srgb, var(--fg) 8%, transparent);
  }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .45s var(--ease); }

  .reader-track {
    display: flex;
    height: 100%;
    transform: translateX(calc(var(--page, 0) * -100%));
    transition: transform .5s var(--ease);
    will-change: transform;
  }
  .reader-track.dragging { transition: none; }

  .page { position: relative; flex: 0 0 100%; width: 100%; height: 100%; overflow: hidden; }
  .page-scroll {
    height: 100%;
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    scrollbar-width: none;
  }
  .page-scroll::-webkit-scrollbar { display: none; }
  .page-inner {
    display: flex;
    flex-direction: column;
    width: 100%;
    min-height: 100%;
    padding: calc(max(0px, env(safe-area-inset-top, 0px)) + 26px) var(--gutter) calc(max(0px, env(safe-area-inset-bottom, 0px)) + 92px);
  }

  .page-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .page-no { font: italic 700 17px/1 var(--font-display); color: var(--accent); letter-spacing: .02em; }
  .page-rule { flex: 1; height: 1px; background: var(--border); }
  .page-sec { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .24em; color: var(--muted); white-space: nowrap; }

  .page-title {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(24px, 6.6vw, 30px);
    font-weight: 700;
    line-height: 1.34;
    letter-spacing: .015em;
    text-wrap: balance;
  }

  .prose { margin-top: 16px; display: grid; gap: 11px; }
  .prose p { margin: 0; font-size: 14px; line-height: 1.76; letter-spacing: .014em; color: var(--fg-body); text-wrap: pretty; }

  .highlight { margin: 22px 0 0; padding-top: 16px; border-top: 1px solid var(--border-strong); position: relative; }
  .tick::before { content: ""; position: absolute; top: -1px; left: 0; width: 36px; height: 2px; background: var(--fg); }
  .highlight blockquote { margin: 14px 0 0; }
  .highlight blockquote, .highlight p {
    margin: 14px 0 0;
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    line-height: 1.62;
    letter-spacing: .02em;
    color: var(--fg);
    text-wrap: balance;
  }

  .entries { margin-top: 10px; }
  .entry { display: grid; grid-template-columns: 40px 1fr; column-gap: 6px; padding: 14px 0; }
  .entry + .entry { border-top: 1px solid var(--border); }
  .entry-no { font: italic 700 16px/1.5 var(--font-display); color: var(--fg); padding-top: 2px; }
  .entry-body h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; line-height: 1.45; letter-spacing: .01em; }
  .entry-body p { margin: 0; font-size: 12.8px; line-height: 1.62; color: var(--muted); text-wrap: pretty; }

  .steps { list-style: none; margin: 20px 0 0; padding: 0; }
  .step { position: relative; display: grid; grid-template-columns: 36px 1fr; column-gap: 14px; padding-bottom: 20px; }
  .step:last-child { padding-bottom: 0; }
  .step::before { content: ""; position: absolute; left: 17.5px; top: 40px; bottom: 4px; width: 1px; background: var(--border-strong); }
  .step:last-child::before { display: none; }
  .step-dot {
    position: relative; z-index: 1;
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--surface);
    display: grid; place-items: center;
    font: italic 700 15px/1 var(--font-display);
    color: var(--fg);
  }
  .step-body h3 { margin: 7px 0 4px; font-size: 14.5px; font-weight: 600; line-height: 1.45; letter-spacing: .01em; }
  .step-body p { margin: 0; font-size: 12.8px; line-height: 1.62; color: var(--muted); text-wrap: pretty; }

  .quote-detail { margin: 16px 0 0; font-size: 12.5px; line-height: 1.8; color: var(--muted); }
  .quote-detail strong { color: var(--fg); font-weight: 600; }

  .page-end { margin: auto 0 0; padding-top: 40px; text-align: center; font-family: var(--font-mono); font-size: 10px; letter-spacing: .42em; text-indent: .42em; color: var(--muted); }

  .cover-inner { padding-top: calc(max(0px, env(safe-area-inset-top, 0px)) + 22px); }
  .cover-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .cover-top-label { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .3em; color: var(--muted); white-space: nowrap; }
  .cover-top-rule { flex: 1; height: 1px; background: var(--border); }
  .cover-fig { margin: 0; display: flex; justify-content: center; }
  .cover-img {
    width: clamp(112px, 34vw, 136px);
    height: auto;
    aspect-ratio: 1080 / 1540;
    border-radius: 2px 6px 6px 2px;
    transform: rotate(-2.2deg);
    box-shadow:
      inset 6px 0 8px -6px color-mix(in srgb, black 45%, transparent),
      0 22px 44px -18px color-mix(in srgb, var(--fg) 45%, transparent),
      0 6px 14px -6px color-mix(in srgb, var(--fg) 22%, transparent);
  }
  .cover-fallback {
    display: grid; place-items: center;
    width: clamp(112px, 34vw, 136px); aspect-ratio: 1080 / 1540;
    padding: 14px; border: 1px solid var(--border-strong); border-radius: 2px 6px 6px 2px;
    transform: rotate(-2.2deg); background: var(--surface);
    box-shadow: 0 22px 44px -18px color-mix(in srgb, var(--fg) 45%, transparent);
    color: var(--accent); font: 700 22px/1.15 var(--font-display); text-align: center;
  }
  .cover-head { margin-top: 16px; text-align: center; }
  .cover-title { margin: 0; font-family: var(--font-display); font-size: clamp(30px, 8.5vw, 40px); font-weight: 700; line-height: 1.12; letter-spacing: .06em; text-indent: .06em; }
  .cover-note { margin: 6px 0 0; font-family: var(--font-display); font-size: 13px; letter-spacing: .12em; text-indent: .12em; color: var(--muted); }
  .cover-en { margin: 8px auto 0; max-width: 40ch; font-family: var(--font-mono); font-size: 8px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); text-wrap: balance; }
  .cover-author { margin: 8px 0 0; font-size: 10px; letter-spacing: .02em; color: var(--muted); }
  .cover-overview { margin: 12px 0 0; font-family: var(--font-display); font-size: 13px; line-height: 1.55; letter-spacing: .02em; color: var(--fg-body); text-wrap: pretty; }

  .cover-promise { margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--border-strong); position: relative; }
  .cover-lead { margin: 14px 0 0; font-family: var(--font-display); font-size: 16.5px; font-weight: 600; line-height: 1.65; letter-spacing: .02em; text-wrap: balance; }
  .take-label { margin: 22px 0 0; font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .26em; color: var(--muted); }
  .take-list { list-style: none; margin: 2px 0 0; padding: 0; }
  .take-row { display: flex; align-items: baseline; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: 14.5px; font-weight: 600; letter-spacing: .02em; }
  .take-row:last-child { border-bottom: 0; }
  .take-no { font: italic 700 14px/1 var(--font-display); color: var(--fg); }

  .cover-actions { margin-top: 12px; display: grid; justify-items: center; gap: 7px; }
  .btn-start {
    display: inline-flex; align-items: center; gap: 9px;
    height: 40px; padding: 0 24px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--bg);
    font-size: 12px; font-weight: 600; letter-spacing: .16em; text-indent: .08em;
    box-shadow: 0 14px 28px -12px color-mix(in srgb, var(--accent) 60%, transparent);
    transition: background-color .18s ease, transform .18s ease;
  }
  .btn-start:hover { background: var(--accent-deep); }
  .btn-start:active { transform: scale(.98); }
  .btn-start svg { width: 15px; height: 15px; }
  .cover-meta { margin: 0; font-family: var(--font-mono); font-size: 8.5px; letter-spacing: .16em; color: var(--muted); }

  .pager {
    position: absolute; z-index: 30;
    left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    gap: 6px;
    padding: 10px 18px calc(max(0px, env(safe-area-inset-bottom, 0px)) + 14px);
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .pager::before { content: ""; position: absolute; top: 0; left: 18px; right: 18px; height: 1px; background: var(--border); }
  .nav-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid var(--border-strong);
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    display: grid; place-items: center;
    color: var(--fg);
    transition: background-color .16s ease, border-color .16s ease, opacity .16s ease;
  }
  .nav-btn svg { width: 17px; height: 17px; }
  .nav-btn:hover:not(:disabled) { background: var(--surface); border-color: var(--fg); }
  .nav-btn:disabled { opacity: .28; cursor: default; }
  .pager-status { display: flex; align-items: baseline; justify-content: center; gap: 7px; min-width: 0; }
  .status-now { font: italic 700 16px/1 var(--font-display); color: var(--accent); }
  .status-rest { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }

  @media (max-height: 700px) {
    :root { --gutter: 18px; }
    .page-inner { padding-top: calc(max(0px, env(safe-area-inset-top, 0px)) + 18px); padding-bottom: calc(max(0px, env(safe-area-inset-bottom, 0px)) + 72px); }
    .page-head { margin-bottom: 12px; }
    .page-title { font-size: 22px; line-height: 1.25; }
    .prose { margin-top: 11px; gap: 7px; }
    .prose p { font-size: 11.5px; line-height: 1.5; }
    .highlight { margin-top: 12px; padding-top: 10px; }
    .highlight blockquote, .highlight p { margin-top: 8px; font-size: 14px; line-height: 1.45; }
    .entries { margin-top: 6px; }
    .entry { grid-template-columns: 30px 1fr; padding: 8px 0; }
    .entry-no { font-size: 13px; }
    .entry-body h3 { margin-bottom: 2px; font-size: 12px; line-height: 1.35; }
    .entry-body p { font-size: 10px; line-height: 1.4; }
    .steps { margin-top: 12px; }
    .step { grid-template-columns: 30px 1fr; column-gap: 10px; padding-bottom: 12px; }
    .step::before { left: 14.5px; top: 34px; }
    .step-dot { width: 30px; height: 30px; font-size: 12px; }
    .step-body h3 { margin: 4px 0 2px; font-size: 12px; }
    .step-body p { font-size: 10px; line-height: 1.4; }
    .cover-inner { padding-top: calc(max(0px, env(safe-area-inset-top, 0px)) + 13px); }
    .cover-top { margin-bottom: 7px; }
    .cover-top-label { font-size: 8px; }
    .cover-img, .cover-fallback { width: 90px; }
    .cover-fallback { font-size: 16px; }
    .cover-head { margin-top: 7px; }
    .cover-title { font-size: 25px; }
    .cover-note { margin-top: 3px; font-size: 10px; }
    .cover-en { display: none; }
    .cover-author { margin-top: 4px; font-size: 8.5px; }
    .cover-overview { margin-top: 6px; font-size: 10.5px; line-height: 1.36; }
    .cover-promise { margin-top: 18px; padding-top: 14px; }
    .cover-lead { margin-top: 8px; font-size: 14px; line-height: 1.5; }
    .take-label { margin-top: 14px; font-size: 9px; }
    .take-list { margin-top: 2px; }
    .take-row { gap: 10px; padding: 10px 0; font-size: 12.5px; line-height: 1.4; }
    .take-no { font-size: 12px; }
    .cover-actions { margin-top: 5px; gap: 3px; }
    .btn-start { height: 31px; padding: 0 17px; font-size: 10px; }
    .btn-start svg { width: 12px; height: 12px; }
    .cover-meta { font-size: 7.5px; }
    .pager { padding: 6px 14px calc(max(0px, env(safe-area-inset-bottom, 0px)) + 8px); }
    .nav-btn { width: 38px; height: 38px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }
</style>
</head>
<body>
<main class="screen" id="screen" aria-label="多页读书卡" data-od-id="reader">
  <div class="progress" aria-hidden="true" data-od-id="progress"><i id="progressFill"></i></div>
  <div class="reader-track" id="readerTrack"></div>
  <nav class="pager" aria-label="翻页" data-od-id="pager">
    <button class="nav-btn" id="prevBtn" type="button" aria-label="上一页" title="上一页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <p class="pager-status" id="pageStatus" aria-live="polite"></p>
    <button class="nav-btn" id="nextBtn" type="button" aria-label="下一页" title="下一页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </nav>
</main>

有目的的练习","body":"设置具体目标，保持专注，得到反馈，并持续挑战当前能力。"},{"title":"导师设计的训练","body":"在成熟领域中，借助有效训练方法和导师设计，系统发展高水平表现。"}]},{"type":"list","section":"有目的练习","title":"一次有效训练要满足四件事","items":[{"title":"目标具体","body":"把大能力缩成这一次能完成、能判断的改进点。"},{"title":"高度专注","body":"练习时主动监控动作和结果，而不是无意识重复。"},{"title":"反馈及时","body":"尽快看见预期与实际之间的差距，才能调整下一次动作。"},{"title":"走出舒适区","body":"选择略高于当前水平的挑战，让原有做法不再够用。"}]},{"type":"list","section":"难度设计","title":"最有效的挑战位于学习区","items":[{"title":"舒适区","body":"任务几乎自动完成，适合交付和巩固，却很少触发能力重组。"},{"title":"学习区","body":"需要全神贯注，错误能被识别，经过提示或调整仍可完成。"},{"title":"恐慌区","body":"难度远超当前结构，只剩猜测和挫败，反馈也无法转成下一步。"}],"highlight":"理想难度不是越难越好，而是刚好迫使你改变做法。"},{"type":"statement","section":"大脑适应","title":"能力上限会随训练改变","body":["第 2 章用大脑适应能力解释训练为何可能改变表现：持续应对合适难度的任务，会迫使身体或认知系统建立新的适应。","挑战太小不会触发改变，压力过大又可能带来倦怠；有效区间在舒适区之外，但不能远到失去控制。"],"highlight":"不要只问“我能不能”，先问“什么挑战能让系统发生适应”。"},{"type":"statement","section":"典型案例","title":"数字记忆训练揭示了什么","body":["一名原本表现普通的学生，通过长期训练把数字分组为跑步成绩等熟悉结构，逐步记住越来越长的数字串。","关键不在记忆容量突然变大，而在于他建立了编码、分组和提取信息的新结构。训练改变的是处理方式。"],"highlight":"突破瓶颈常常不是更用力，而是找到一种更有效的表征。"},{"type":"statement","section":"心理表征","title":"高手看见的是结构，不是碎片","body":["心理表征可以理解为头脑中用于识别模式、解释信息、组织行动和预判结果的内部结构。","它让高手更快分辨关键线索，并在行动前形成更准确的计划；新手面对的则常是一堆彼此分离的信息。"],"highlight":"专业能力的隐形部分，是你如何组织所看见的东西。"},{"type":"list","section":"表征实例","title":"不同高手拥有不同的内部地图","items":[{"title":"棋手","body":"看见的不是孤立棋子，而是局面模式、威胁关系和可能的后续变化。"},{"title":"音乐家","body":"听见的不只是单个音符，还包括乐句结构、张力走向和动作预期。"},{"title":"医生","body":"把症状、病史与检查结果组织成诊断模式，而不是逐条机械核对。"},{"title":"写作者","body":"能同时看见论点、证据、节奏和读者疑问，并据此调整篇章。"}]},{"type":"list","section":"良性循环","title":"练习与表征彼此增强","items":[{"title":"先有一点结构","body":"已有表征帮助你看出下一处值得训练的差距。"},{"title":"再做针对练习","body":"训练把模糊差距转化为可比较的动作与结果。"},{"title":"形成更好结构","body":"新的经验被重新组织，之后识别、计划与自我纠错更快。"}]},{"type":"statement","section":"黄金标准","title":"并非所有领域都有标准答案","body":["严格意义上的这种训练，更容易出现在规则成熟、表现标准清楚、训练方法经过长期发展的领域。","它还需要懂得如何培养高水平表现的导师。离开这些条件时，更准确的说法是借用这些训练原则，而不是声称拥有同等训练体系。"],"highlight":"先确认领域是否成熟，再决定怎样借鉴。"},{"type":"statement","section":"反常识","title":"一万小时不是成功公式","body":["目录专门讨论“一万小时法则的错与对”。全书强调的重点不是某个统一时长，而是练习类型、训练质量和领域条件。","相同的投入时间，如果一个人只重复熟悉动作，另一个人持续针对弱点、获得反馈，两者不会得到相同结果。"],"highlight":"时长不能替代方法，也不能保证结果。"},{"type":"list","section":"反馈系统","title":"反馈要从结果深入到过程","items":[{"title":"结果反馈","body":"知道对错、快慢或成败，只能告诉你差距存在。"},{"title":"过程反馈","body":"定位哪一个动作、判断或顺序导致结果偏差。"},{"title":"结构反馈","body":"发现自己遗漏了什么模式，进而更新观察和思考方式。"}],"highlight":"高质量反馈不是一句“做得不好”，而是给出下一轮能改什么。"},{"type":"list","section":"工作迁移","title":"把工作现场变成训练场","items":[{"title":"分离训练与交付","body":"交付追求完成，训练则允许慢下来试错、复盘和重做。"},{"title":"选一个可观察动作","body":"例如不是“提升汇报”，而是训练三分钟内讲清问题、证据与请求。"},{"title":"缩短反馈距离","body":"录屏、自评、同伴评审或导师点评，都要在下一轮前产生修正线索。"}]},{"type":"list","section":"自主训练","title":"没有导师时怎样继续","items":[{"title":"寻找可信范例","body":"先找到高质量表现和明确标准，避免只和自己的感觉比较。"},{"title":"留下过程证据","body":"保留录像、草稿、数据或错误记录，给自我反馈提供材料。"},{"title":"遇到平台就换练法","body":"重新拆分技能、调整难度或改变反馈方式，而不是单纯延长时长。"},{"title":"用环境保护动机","body":"固定时间、降低启动阻力，并让阶段性改善看得见。"}]},{"type":"statement","section":"动机系统","title":"坚持不是靠意志硬撑","body":["高强度训练并不天然令人愉快。更可靠的做法，是同时减少停止的理由，并增加继续的理由。","固定时段、同伴承诺、看得见的进步记录和清晰的阶段目标，都能减少每天重新做决定的消耗。"],"highlight":"把动机设计成环境，而不是等待情绪到来。"},{"type":"list","section":"恢复节奏","title":"高质量训练需要主动恢复","items":[{"title":"短而专注","body":"真正拉伸能力的练习消耗很大，宁可保持高质量短时段，也不要疲劳堆时长。"},{"title":"睡眠与间隔","body":"休息让新形成的连接得到巩固，也降低动作在疲劳中变形的概率。"},{"title":"交替任务","body":"不同子技能轮换，可保持注意力，同时避免单一动作过度消耗。"}]},{"type":"list","section":"成长路线","title":"从兴趣到创新有四个阶段","items":[{"title":"产生兴趣","body":"先让活动与好奇、乐趣和可获得的成功经验连接。"},{"title":"变得认真","body":"建立规律训练，并开始接受标准、反馈和指导。"},{"title":"全力投入","body":"围绕高水平目标安排长期、困难且持续的训练。"},{"title":"开拓创新","body":"先掌握领域已有结构，再以深厚能力突破原有边界。"}]},{"type":"statement","section":"天赋问题","title":"别让天赋解释过早终止行动","body":["第 8 章集中检视天才、神童和天生才华的解释，提醒读者不要忽略训练经历与长期适应所塑造的能力。","这不等于所有人都能在任何领域达到同一高度，而是说：在训练证据出现之前，不能把当前水平直接当成固定上限。"],"highlight":"把“我没有天赋”改写成“我还缺哪种有效训练”。"},{"type":"list","section":"方法边界","title":"练习重要，但不是唯一变量","items":[{"title":"领域成熟度","body":"有明确标准和成熟教法的领域，更容易设计高质量训练。"},{"title":"机会与资源","body":"导师、时间、经济条件和早期接触，会影响训练能否长期发生。"},{"title":"身体与个体差异","body":"生理条件、年龄和既有经验可能改变路径、速度与可达范围。"},{"title":"创造性工作","body":"标准模糊的任务需要借鉴训练原则，同时保留探索、判断与跨域连接。"}],"highlight":"它是一套强大的成长方法，不是一条抹平所有差异的万能公式。"},{"type":"steps","section":"训练模型","title":"用一轮闭环替代机械重复","items":[{"title":"定点：5 分钟","body":"选一个弱点，写下本轮标准；完成标志是目标能被别人判断。"},{"title":"拉伸：25 分钟","body":"练习略高于当前水平的任务，全程只盯一个改进点。"},{"title":"回路：10 分钟","body":"对照范例或反馈改做一次；完成标志是记录一处变化及下一弱点。"}]},{"type":"list","section":"场景迁移","title":"四类任务怎样拆成练习","items":[{"title":"写作","body":"只练开头、论证、转场或删改中的一个环节，并保留版本对照。"},{"title":"演讲","body":"录像三分钟表达，用信息清晰度、停顿与听众复述结果反馈。"},{"title":"语言","body":"针对发音、听辨或句型做窄任务，立即纠错后重复一轮。"},{"title":"专业工作","body":"从真实案例中抽取判断步骤，用专家范例校准自己的决策路径。"}]},{"type":"steps","section":"行动转化","title":"今天就完成一次四十分钟训练","items":[{"title":"写下一个弱点","body":"5 分钟内把“想变好”改成一个能观察的动作和通过标准。"},{"title":"完成三次短循环","body":"每次 8 分钟练习、2 分钟反馈，只改同一个关键动作。"},{"title":"留下复盘证据","body":"5 分钟保存前后版本，写明有效调整；完成标志是下一次目标已确定。"}]},{"type":"list","section":"终极凝结","title":"真正要带走的是四个抓手","items":[{"title":"目标可判","body":"把能力愿望改成一次训练能够验证的小目标。"},{"title":"专注拉伸","body":"离开自动化重复，但让难度仍处于可修正范围。"},{"title":"反馈成环","body":"让每轮结果都能改变下一轮动作。"},{"title":"表征升级","body":"最终改变的不是熟练次数，而是识别、判断与计划结构。"}]}]};
document.documentElement.style.setProperty('--accent', BOOK_DATA.book.cover_color || '#b23a2d');
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
};
const pageData = BOOK_DATA.pages || [];
const total = pageData.length + 1;

function coverPage(book) {
  const page = el('section', 'page page-cover');
  page.dataset.odId = 'page-cover';
  page.setAttribute('aria-roledescription', '卡片');
  page.setAttribute('aria-label', `第 1 页，共 ${total} 页：封面`);
  const scroll = el('div', 'page-scroll');
  const inner = el('div', 'page-inner cover-inner');

  const top = el('div', 'cover-top');
  top.append(el('span', 'cover-top-label', "READER'S CARD"));
  top.append(el('span', 'cover-top-rule'));
  inner.append(top);

  const fig = el('figure', 'cover-fig');
  if (book.cover_image) {
    const img = el('img', 'cover-img');
    img.src = book.cover_image;
    img.alt = `《${book.title}》书籍封面`;
    img.width = 820;
    img.height = 1170;
    img.draggable = false;
    img.decoding = 'async';
    fig.append(img);
  } else {
    fig.append(el('div', 'cover-fallback', book.title));
  }
  inner.append(fig);

  const head = el('header', 'cover-head');
  head.append(el('h1', 'cover-title', book.title));
  if (book.cover_note) head.append(el('p', 'cover-note', book.cover_note));
  if (book.cover_english) {
    head.append(el('p', 'cover-en', `${book.cover_kicker || 'PEAK'} — ${book.cover_english}`));
  }
  if (book.author) head.append(el('p', 'cover-author', book.author));
  inner.append(head);

  if (book.overview) inner.append(el('p', 'cover-overview', book.overview));

  const promise = el('section', 'cover-promise tick');
  if (book.subtitle) promise.append(el('p', 'cover-lead', book.subtitle));
  promise.append(el('p', 'take-label', '这次阅读，你会带走'));
  const list = el('ol', 'take-list');
  (book.cover_points || []).forEach((text, i) => {
    const row = el('li', 'take-row');
    row.append(el('span', 'take-no', String(i + 1).padStart(2, '0')));
    row.append(el('span', 'take-text', text));
    list.append(row);
  });
  promise.append(list);
  inner.append(promise);

  const actions = el('div', 'cover-actions');
  const start = el('button', 'btn-start', '开始阅读');
  start.type = 'button';
  start.id = 'startBtn';
  start.innerHTML = '<span>开始阅读</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  actions.append(start);
  actions.append(el('p', 'cover-meta', `${pageData.length} 张知识卡 · 左右滑动翻页`));
  inner.append(actions);

  scroll.append(inner);
  page.append(scroll);
  return page;
}

function appendHighlight(wrap, text) {
  if (!text) return;
  const fig = el('figure', 'highlight tick');
  fig.append(el('p', null, text));
  wrap.append(fig);
}

function contentPage(p, no) {
  const page = el('section', 'page');
  page.dataset.odId = 'page-' + String(no).padStart(2, '0');
  page.setAttribute('aria-roledescription', '卡片');
  page.setAttribute('aria-label', `第 ${no} 页，共 ${total} 页：${p.title || p.section || ''}`);
  const scroll = el('div', 'page-scroll');
  const inner = el('div', 'page-inner');

  const head = el('header', 'page-head');
  head.append(el('span', 'page-no', String(no).padStart(2, '0')));
  head.append(el('span', 'page-rule'));
  head.append(el('span', 'page-sec', p.section || ''));
  inner.append(head);
  inner.append(el('h2', 'page-title', p.title));

  if (p.type === 'statement') {
    const prose = el('div', 'prose');
    (p.body || []).forEach(text => prose.append(el('p', null, text)));
    inner.append(prose);
    appendHighlight(inner, p.highlight);
  } else if (p.type === 'steps') {
    const list = el('ol', 'steps');
    (p.items || []).forEach((item, i) => {
      const step = el('li', 'step');
      step.append(el('span', 'step-dot', String(i + 1)));
      const body = el('div', 'step-body');
      body.append(el('h3', null, item.title));
      body.append(el('p', null, item.body));
      step.append(body);
      list.append(step);
    });
    inner.append(list);
    appendHighlight(inner, p.highlight);
  } else if (p.type === 'quote') {
    const fig = el('figure', 'highlight tick');
    fig.append(el('blockquote', null, p.quote));
    if (p.interpretation || p.scene) {
      const detail = el('figcaption', 'quote-detail');
      if (p.interpretation) detail.append(el('strong', null, '解读｜'), document.createTextNode(p.interpretation));
      if (p.scene) detail.append(document.createElement('br'), el('strong', null, '用在｜'), document.createTextNode(p.scene));
      fig.append(detail);
    }
    inner.append(fig);
  } else {
    const list = el('div', 'entries');
    (p.items || []).forEach((item, i) => {
      const row = el('div', 'entry');
      row.append(el('span', 'entry-no', String(i + 1).padStart(2, '0')));
      const body = el('div', 'entry-body');
      body.append(el('h3', null, item.title));
      body.append(el('p', null, item.body));
      row.append(body);
      list.append(row);
    });
    inner.append(list);
    appendHighlight(inner, p.highlight);
  }

  if (no === total) inner.append(el('p', 'page-end', '完'));
  scroll.append(inner);
  page.append(scroll);
  return page;
}

const track = document.getElementById('readerTrack');
const screen = document.getElementById('screen');
const fill = document.getElementById('progressFill');
const btnPrev = document.getElementById('prevBtn');
const btnNext = document.getElementById('nextBtn');
const status = document.getElementById('pageStatus');
const pages = [coverPage(BOOK_DATA.book), ...pageData.map((p, i) => contentPage(p, i + 2))];
pages.forEach(page => track.append(page));
document.title = `${BOOK_DATA.book.title} · 读书卡`;
screen.setAttribute('aria-label', `《${BOOK_DATA.book.title}》读书卡`);

let current = 0;
function showPage(index) {
  current = Math.max(0, Math.min(total - 1, index));
  track.style.setProperty('--page', current);
  fill.style.width = (total > 1 ? current / (total - 1) * 100 : 100) + '%';
  status.replaceChildren(
    el('span', 'status-now', String(current + 1).padStart(2, '0')),
    el('span', 'status-rest', `/ ${total} · ${current === 0 ? '封面' : pageData[current - 1].section || ''}`)
  );
  btnPrev.disabled = current === 0;
  btnNext.disabled = current === total - 1;
  pages.forEach((page, i) => {
    const hidden = i !== current;
    page.setAttribute('aria-hidden', String(hidden));
    page.toggleAttribute('inert', hidden);
  });
}
btnPrev.addEventListener('click', () => showPage(current - 1));
btnNext.addEventListener('click', () => showPage(current + 1));
document.getElementById('startBtn').addEventListener('click', () => showPage(1));

let ptrId = null, startX = 0, startY = 0, startT = 0, decided = false, horiz = false;
screen.addEventListener('pointerdown', event => {
  if (ptrId !== null || event.target.closest('button, a')) return;
  ptrId = event.pointerId;
  startX = event.clientX;
  startY = event.clientY;
  startT = performance.now();
  decided = false;
  horiz = false;
});
screen.addEventListener('pointermove', event => {
  if (event.pointerId !== ptrId) return;
  const dx = event.clientX - startX;
  const dy = event.clientY - startY;
  if (!decided) {
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    decided = true;
    horiz = Math.abs(dx) > Math.abs(dy) * 1.15;
    if (horiz) {
      screen.setPointerCapture?.(ptrId);
      track.classList.add('dragging');
      screen.classList.add('grabbing');
    }
  }
  if (!horiz) return;
  let offset = dx;
  if ((current === 0 && dx > 0) || (current === total - 1 && dx < 0)) offset = dx / 3;
  track.style.transform = `translateX(calc(var(--page) * -100% + ${offset}px))`;
});
function endPointer(event) {
  if (event.pointerId !== ptrId) return;
  const wasHoriz = horiz;
  const dx = event.clientX - startX;
  const dt = performance.now() - startT;
  ptrId = null; decided = false; horiz = false;
  track.classList.remove('dragging');
  screen.classList.remove('grabbing');
  track.style.transform = '';
  if (!wasHoriz) return;
  const flick = dt < 260 && Math.abs(dx) > 26;
  if ((dx < -56 || (flick && dx < 0)) && current < total - 1) showPage(current + 1);
  else if ((dx > 56 || (flick && dx > 0)) && current > 0) showPage(current - 1);
  else showPage(current);
}
screen.addEventListener('pointerup', endPointer);
screen.addEventListener('pointercancel', endPointer);

let wheelAcc = 0, wheelLock = false;
screen.addEventListener('wheel', event => {
  if (Math.abs(event.deltaX) <= Math.abs(event.deltaY) * 1.4) { wheelAcc = 0; return; }
  event.preventDefault();
  if (wheelLock) return;
  wheelAcc += event.deltaX;
  if (Math.abs(wheelAcc) > 90) {
    showPage(current + (wheelAcc > 0 ? 1 : -1));
    wheelAcc = 0;
    wheelLock = true;
    setTimeout(() => { wheelLock = false; }, 480);
  }
}, { passive: false });

document.addEventListener('keydown', event => {
  if (event.key === 'ArrowLeft') { event.preventDefault(); showPage(current - 1); }
  if (event.key === 'ArrowRight') { event.preventDefault(); showPage(current + 1); }
  if (event.key === 'Home') { event.preventDefault(); showPage(0); }
  if (event.key === 'End') { event.preventDefault(); showPage(total - 1); }
});

showPage(0);
</script>
